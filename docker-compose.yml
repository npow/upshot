services:
  claude-relay:
    build:
      context: .
      dockerfile: Dockerfile.relay
    volumes:
      - ${HOME}/.claude:/root/.claude:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18082/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      UPSHOT_CONFIG: /app/config.docker.yaml
    volumes:
      - upshot_data:/data
    depends_on:
      claude-relay:
        condition: service_healthy
    restart: "no"

volumes:
  upshot_data:
