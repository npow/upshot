name: Daily pipeline trigger

# Schedule disabled 2026-05-09: the Hetzner host (188.34.193.79) that runs
# claude-relay + pipeline became unreachable on TCP (host up via ICMP, all
# ports dropped — likely a firewall rule got removed on reboot). The cron
# was failing every morning with "ssh: connect ... Connection timed out".
# Re-enable by uncommenting the `schedule:` block once the box's SSH is
# reachable again. workflow_dispatch is kept so the trigger is still
# manually callable for testing once the host is back.
on:
  # schedule:
  #   - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Trigger pipeline on Hetzner
        run: |
          ssh -o StrictHostKeyChecking=no root@188.34.193.79 'bash -s' <<'SCRIPT'
          set -e
          cd /root/upshot
          git pull
          docker compose build pipeline
          docker compose run --rm pipeline

          # Commit and push blog post from host (has SSH keys)
          DATE=$(date +%Y-%m-%d)
          git add blog/content/posts/
          if ! git diff --cached --quiet; then
            git commit -m "briefing: $DATE"
            git push origin main
          fi
          SCRIPT
